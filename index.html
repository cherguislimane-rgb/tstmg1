<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D1220">
<title>Mes Copies · Éco-Droit STMG</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1220;
    --card: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.12);
    --text: #EAEEF7;
    --muted: #8B93A7;
    --accent: #F2A65A;
    --danger: #E56B6F;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(242, 166, 90, 0.13), transparent),
      radial-gradient(ellipse 70% 50% at 90% 110%, rgba(232, 115, 90, 0.10), transparent);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 32px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    text-align: center;
    animation: rise .5s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
  .ring {
    width: 88px; height: 88px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: conic-gradient(var(--accent) 0deg 260deg, rgba(255,255,255,.12) 260deg 360deg);
  }
  .ring-inner {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #131A2C;
    display: grid; place-items: center;
    font-family: 'Sora', sans-serif;
    font-weight: 800; font-size: 22px;
    letter-spacing: .5px;
  }
  h1 { font-family: 'Sora', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 28px; line-height: 1.5; }
  label { display: block; text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 8px; }
  input {
    width: 100%;
    background: rgba(0,0,0,.28);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    font-family: 'Sora', monospace, sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: .35em;
    text-align: center;
    text-transform: lowercase;
    padding: 14px 8px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 15px;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #201409;
    font-family: 'Sora', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, filter .2s;
  }
  button:active { transform: scale(.98); }
  button:disabled { filter: grayscale(.6) brightness(.7); cursor: wait; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .error {
    display: none;
    margin-top: 14px;
    color: var(--danger);
    font-size: 13.5px;
    line-height: 1.45;
  }
  .error.show { display: block; }
  .hint { margin-top: 24px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <main class="card">
    <div class="ring"><div class="ring-inner">ÉD</div></div>
    <h1>Mes Copies</h1>
    <p class="sub">Économie-Droit STMG<br>Retrouve tes copies corrigées et ta progression.</p>
    <label for="code">Ton code personnel</label>
    <input id="code" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="8" placeholder="······">
    <button id="go">Ouvrir mon espace</button>
    <p class="error" id="err">Code introuvable. Vérifie les 6 caractères donnés par ton professeur.</p>
    <p class="hint">Ton code est personnel : ne le partage pas.</p>
  </main>

<script>
  // Déjà connecté ? Direction l'app.
  const saved = localStorage.getItem('eleve_code');
  if (saved) location.replace('app/');

  const input = document.getElementById('code');
  const btn = document.getElementById('go');
  const err = document.getElementById('err');

  async function login() {
    const code = input.value.trim().toLowerCase();
    if (!code) { input.focus(); return; }
    btn.disabled = true;
    err.classList.remove('show');
    try {
      const r = await fetch(`data/eleves/${encodeURIComponent(code)}.json`, { cache: 'no-store' });
      if (!r.ok) throw new Error('not found');
      await r.json();
      localStorage.setItem('eleve_code', code);
      location.href = 'app/';
    } catch (e) {
      err.classList.add('show');
      btn.disabled = false;
      input.select();
    }
  }
  btn.addEventListener('click', login);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
